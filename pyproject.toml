[project]
name = "protbench"
version = "0.1.0"
description = "Unified protein model benchmark suite: frozen probes, finetuning, sequence + residue tasks"
# 3.10, not 3.11+: protJepa's venv is 3.10.12 and must be able to run this.
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "torch",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
# peft is imported lazily, so probe-only runs work without it installed.
finetune = ["peft>=0.19"]
# transformers 5.5.0 declares kernels<0.13; 0.13+ breaks `import transformers`.
kernels = ["kernels>=0.12,<0.13"]

# ponytail: flat script repo, not an installable package. Callers run
# `python protein_benchmark_suite.py` or put this dir on sys.path.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is a package but test_disprot imports test_token_classification_probe flat.
pythonpath = [".", "tests"]
markers = ["slow: heavyweight tests that hit the network / download models"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
