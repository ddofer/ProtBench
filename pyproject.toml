[project]
name = "protbench"
version = "0.1.0"
description = "Unified protein model benchmark suite: frozen probes, finetuning, sequence + residue tasks"
# 3.10 keeps this usable from older project venvs.
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "torch",
    "transformers",
]

[project.optional-dependencies]
# peft is imported lazily, so probe-only runs work without it installed.
finetune = ["peft>=0.19"]
# phmmer is a Python package, not a system binary. mmseqs2 IS a system binary
# (conda install -c bioconda mmseqs2) and cannot be declared here.
alignment = ["pyhmmer>=0.10"]
# Only final_benchmark_report.py plots, and it imports matplotlib inside the
# function, so probe runs never need it.
plots = ["matplotlib"]
# Defer to whatever window the resolved transformers declares, rather than
# restating it here -- the hardcoded <0.13 was written against transformers 5.5
# and went unsatisfiable by 5.15, which asks for >=0.16.
kernels = ["transformers[kernels]"]

# README documents `pytest -m "not slow"`, so pytest has to come from a plain
# `uv sync` -- dependency-groups are installed by default, extras are not.
[dependency-groups]
dev = ["pytest"]

# ponytail: flat script repo, not an installable package. Callers run
# `python protein_benchmark_suite.py` or put this dir on sys.path.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "contrib/proteva"]
# tests/ is a package but test_disprot imports test_token_classification_probe flat.
pythonpath = [".", "tests", "contrib/proteva"]
markers = ["slow: heavyweight tests that hit the network / download models"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
